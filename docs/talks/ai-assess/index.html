<div class="center">
  <h1>Assessing AI</h1>
  <p><em>how to tell if AI coding tools are working without fooling yourself</em></p>
  <p><img src="../../files/talks/codebender-logo.svg" alt="Third Bit logo" width="20%" /></p>
  <h2>Greg Wilson</h2>
  <p>2026-11-01</p>
  <p><img src="../../files/talks/cc-by.svg" width="20%" alt="CC-BY" /></p>
</div>

---


## What This Talk Is About

-   In 2023, GitHub announced that its AI tools made developers 55% faster [Peng2023]

-   That number appeared in every executive presentation for a year

-   How would you know whether to believe it?

-   This talk

    -   How we get the answer wrong

    -   How we can get it right

---

## Why Should You Listen to Me?

-   Forty years writing software and teaching programming

-   The last few years reading research on how we know things about software

-   I am not going to tell you AI-assisted coding doesn't work

-   I am going to tell you how to find out whether it works *for you*
    -   Singular and plural

---

## The Real Question

-   "Is AI helping my team?" sounds simple

-   It hides three questions:

    -   Helping with *what*?

    -   Measured *how*?

    -   Compared to *what*?

-   These are not pedantic questions

-   The answer you get depends entirely on how you operationalize them

---

## This Is Hard

-   Software output is not homogeneous

    -   A ten-line bugfix may be worth more than a thousand-line feature

-   Much of software work is invisible

    -   Developers spend only about a quarter of their day writing code [Meyer2017]

-   [Sadowski2019] is an entire book devoted to "this is difficult"

---

## For Example

-   Prechelt had 73 professional developers solve the same task [Prechelt2000]

-   Completion times ranged from 0.6 to 63 hours (a 105X spread)

-   Controlling for programming language: 17X

-   With a careful definition of "more productive": 5X

-   The answer depends on exactly what question you ask

---

## How We Get It Wrong

-   Four recurring mistakes sit underneath the hype

    -   Measuring the easy thing

    -   Measuring too small

    -   Comparing to nothing

    -   Asking people how they feel

-   Each is a way of mistaking activity for value

---

## Wrong #1: Measure the Easy Thing

-   A *proxy metric* stands in for something harder to measure directly

-   Lines of code: a 40% increase per developer measures verbosity, not value [Sadowski2019]

-   Commit and PR counts: developers make more, smaller commits when commits are tracked [McKinsey2023]

-   Adoption rate: measures whether the tool is installed, not whether it helps

-   Acceptance rate: measures whether code looked plausible enough to press Tab [Bakal2025]

--

-   *Goodhart's Law*: when a measure becomes a target, it ceases to be a good measure [Goodhart1984]

-   Activity is not output, and output is not value

---

## Wrong #2: Measure Too Small

-   Timing a 90-minute greenfield task tells you about a 90-minute greenfield task [Peng2023]

-   Real work: unfamiliar codebases, ambiguous tickets, coordinating with colleagues

-   Individual speed is not system throughput

    -   If review is the bottleneck, more code makes cycle time worse [Forsgren2021]

--

-   The easy half gets measured: code generation speed

-   The hard half doesn't: review time, debugging confidently-wrong suggestions, security debt [Pearce2022]

-   Five major LLMs evaluated in 2025: none produced web code meeting industry security standards [Dora2025]

---

## Wrong #3: Compare to Nothing

-   Before/after with no control group cannot separate the AI from
    the twelve new engineers, the refactored CI, and the new cloud provider

-   Comparing AI to "nothing" uses a baseline that does not exist in practice

    -   Developers without LLMs use documentation, colleagues, and their own thinking

-   The question is whether AI beats the alternatives developers already have

---

## Wrong #4: Ask People

-   "87% of developers report feeling more productive with AI tools" [Liang2024]

    -   Novelty effect: new tools feel faster because they are new — and that fades

    -   Hawthorne effect: people work differently when they know they are being watched

    -   Social desirability bias: respondents say what they think management wants to hear

--

-   Volunteers vs. non-volunteers:
    *early adopters* are more motivated and more likely to be high performers

    -   A two-year study found Copilot users were more active than non-users
        even before the tool was introduced [Stray2026]

---

## Who Does This?

-   *Empirical Software Engineering* studies how software is actually built

    -   The field has existed since the 1960s

    -   Draws on psychology, sociology, economics, and statistics as well as computer science

-   Bad news: most studies don't address questions practitioners care about [Begel2014]

-   Good news: "most" isn't "all"

--

-   Bad news: you don't have ESE researchers in house

-   Good news: you (probably) have someone just as good

---

## Turn to the UX Researchers

-   Your organization does not need to invent an AI assessment program from scratch

-   UX researchers already have the right intellectual tools

    -   They do rigorous *qualitative* research: interviews, think-aloud
        sessions, and thematic analysis [Braun2006, Goodman2012]

    -   They do rigorous *quantitative* research: usability metrics and
        the statistics to interpret them [Tullis2013, Sauro2016]

-   They are already trained to ask "does this actually help people do their work?"

--

-   So turn to your UX research team to create the assessment program

-   The rest of this talk is a tour of their toolkit

---

## Where to Start

-   *Goal-Question-Metric* provides a structured path from intent to measurement [Basili1994]

-   Define the goal: what object, what property, from whose viewpoint, in what context

-   Generate the questions whose answers would tell you whether the goal was achieved

-   Then pick the metric that answers each question

--

-   Does the metric actually measure what you care about?

-   If possible, get someone *outside* your organization to challenge you on this

---

## Measure Outcomes, Not Activity

-   The *DORA metrics* have better construct validity than activity counts [Forsgren2018]

    -   Deployment frequency

    -   Lead time for changes

    -   Change failure rate

    -   Time to restore service

-   They are tied to customer outcomes rather than developer busyness

-   Blind spots remain: a team can score well while building the wrong product

---

## Getting Started

-   Use *qualitative methods* when you do not yet know what to measure

-   They answer "what is happening?" and "why?" rather than "how much?"

-   E.g., a study of 410 developers revealed where AI helps and where it gets in the way [Liang2024]

    -   Invisible to any study that only measures task completion times

---

## A Checklist for Any Study

-   *Conclusion validity*: was the sample large enough? are effect sizes reported?

-   *Internal validity*: was there a control group? random assignment? novelty and learning ruled out?

-   *Construct validity*: does the measurement actually capture the claim?

-   *External validity*: are the subjects representative of the population you care about?

---

## Interviews

-   Do interviews before creating surveys

-   *Semi-structured interviews* have a guide but allow follow-up

    -   Consistent enough to compare, flexible enough to surprise

-   *Open questions* invite narrative; *closed questions* invite classification

-   Avoid leading questions: "Don't you find it faster?" assumes the answer

-   Pilot with 3–5 people before distributing it

    -   And make the changes

---

## Thematic Analysis

-   *Open coding*: read through the data and tag segments with descriptive labels

-   *Gerund coding*: "avoiding AI for security tasks" rather than "AI distrust"

    -   This preserves what participants are actually doing

-   A theme is a claim you could write as a sentence, not a bucket for related quotes

-   Stop collecting data when new interviews stop introducing new codes [Braun2019]

---

## Controlled Experiments

-   Manipulate one variable and measure its effect while holding others constant

-   Randomization assigns participants to conditions randomly, distributing unknown confounders

    -   This is the mechanism that makes causal claims defensible

-   Full *blinding* is rarely possible in software engineering

    -   The developers know if they're using AI

---

## Pitfalls

-   *HARKing*: hypothesizing after the results are known

    -   I.e., writing the paper as if the pattern you found after analysis was predicted in advance

-   *p-hacking*: running twenty analyses and reporting only the one with p < 0.05

    -   With 20 independent tests, you expect one false positive by chance

-   *Pre-registration* commits hypotheses before data collection, making both problems visible

-   If authors will not share data, there is a decent chance of errors in the work [Wicherts2011]

---

## Observational Studies

-   Measure the world as it is: real behavior, large datasets, no ethical problem withholding an intervention

-   Disadvantage: you can't establish causation because confounders cannot be ruled out

-   GitHub data is not a representative sample of software development

    -   Survivorship bias and "looking where the light is"

-   Projects with more tests also tend to have more experienced developers

    -   So you cannot attribute lower defect rates to testing alone

---

## Do It Cheaply First

-   A small, informal study produces better evidence than a meeting [Hall2019]

-   Five sessions are enough to find most problems in a specific workflow [Nielsen1993]

    -   Enough for "we observed developers getting stuck here"

    -   Not enough for "X% of developers have this problem" or "AI causes more bugs"

--

-   *Formative evaluation* improves a thing; *summative evaluation* decides whether to deploy it

-   Mislabeling formative evidence as summative kills credibility

---

## Think-Aloud and RITE

-   *Think-aloud*: "say out loud whatever you are thinking" while doing a concrete task

    -   "Given this pull request, use the assistant to summarize the changes"

-   Observe hesitation, backtracking, and expectations that turn out wrong

-   Do not help when they get stuck: you will not be there in production

-   RITE (Rapid Iterative Testing and Evaluation):
    fix the worst problem you observed before the next session [Medlock2002]

---

## Please

-   Ask for evidence before adopting

    -   What study supports the claim?

    -   Is it applicable to your context?

    -   Can you see the raw data?

-   When an executive cites a productivity statistic, ask:

    -   Who funded the study?

    -   What task was studied?

    -   Was there was a control group?

--

-   Please document and share your organization's experience

---

## Conclusion

-   These mistakes are not unique to AI research

-   The same problems appear in studies of agile, TDD, and other practices

-   The fix is to apply what the human sciences already know

-   Better yet: hand the job to your UX researchers

    -   They already practice the rigorous qualitative and quantitative methods described here

-   We do not have to settle for hype: the methods are ready
